[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "finbro"
version = "0.1.0"
description = "Lokalna aplikacja do podziału dochodów na koperty, rozliczania przelewów i śledzenia majątku"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn>=0.54,<1.0",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4.0",
    "alembic>=1.20,<2.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "hypothesis>=6.169,<7.0",
    "poethepoet>=0.45,<1.0",
]

# Skróty poleceń deweloperskich (jak skrypty npm): poe dev, poe test, poe --help.
[tool.poe.tasks]
db = { cmd = "docker compose up -d --wait db", help = "Uruchom bazę z docker compose i poczekaj, aż będzie gotowa" }
migrate = { cmd = "alembic upgrade head", help = "Wykonaj migracje bazy" }
serve = { cmd = "uvicorn finbro.web.app:create_app --factory --reload --host 127.0.0.1 --port 8000", help = "Uruchom aplikację z przeładowaniem po zmianach" }
dev = { sequence = ["db", "migrate", "serve"], help = "Baza, migracje i aplikacja deweloperska na http://127.0.0.1:8000" }
test = { cmd = "pytest", help = "Uruchom testy (argumenty przekazywane do pytest)" }

[tool.setuptools.packages.find]
include = ["finbro*"]

[tool.setuptools.package-data]
finbro = ["web/templates/**/*", "web/static/**/*", "db/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    # Starlette 1.7 zaleca pakiet httpx2 dla TestClient; zostajemy przy httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
