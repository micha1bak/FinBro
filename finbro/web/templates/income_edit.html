{% extends "base.html" %}
{% block title %}Edycja dochodu – FinBro{% endblock %}
{% block content %}
<h1>Edycja dochodu</h1>
{% if error %}<div class="notice error" id="error">{{ error }}</div>{% endif %}
<form class="panel" method="post" action="/incomes/{{ income.id }}">
  <label>Data <input type="date" name="date" value="{{ form.date }}" required></label>
  <label>Źródło <input type="text" name="source" value="{{ form.source }}" maxlength="200" required></label>
  <label>Kwota <input type="text" name="amount" value="{{ form.amount }}" inputmode="decimal" required size="10"></label>
  <span class="form-choice">Forma
    {% for f in forms %}<label><input type="radio" name="form" value="{{ f.value }}"{% if form.form == f.value %} checked{% endif %}> {{ f.label }}</label>{% endfor %}
  </span>
  <button type="submit">Zapisz</button>
  <a href="/?month={{ income.date.strftime('%Y-%m') }}">Anuluj</a>
</form>
{% endblock %}
