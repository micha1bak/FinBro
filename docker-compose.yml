name: finbro

services:
  db:
    # Wersja główna przypięta jawnie: zmiana wymaga pg_dump/pg_restore (README).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w pliku .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
    ports:
      # Tylko loopback hosta: baza nie jest osiągalna z sieci.
      - "127.0.0.1:5432:5432"
    volumes:
      # Od PostgreSQL 18 obraz trzyma dane w /var/lib/postgresql/<wersja>/docker,
      # więc wolumen montujemy w /var/lib/postgresql (a nie w .../data).
      - finbro-pgdata:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    image: finbro-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_URL: http://model-runner.docker.internal/engines/v1
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Testy w kontenerze: docker compose run --rm tests pytest [argumenty]
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    image: finbro-tests
    environment:
      # Oba adresy wskazują bazę testową, żeby testy nie dotykały danych aplikacji.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/finbro_test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/finbro_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  finbro-pgdata:
    name: finbro-pgdata
